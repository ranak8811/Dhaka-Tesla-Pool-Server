services:
  postgres:
    image: postgres:16-alpine
    container_name: dhaka-tesla-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesla_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesla_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "5432:5432"
    volumes:
      - dhaka_tesla_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tesla_admin} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - dhaka_tesla_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhaka-tesla-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tesla_admin}:${POSTGRES_PASSWORD:-tesla_secret_password}@postgres:5432/${POSTGRES_DB:-dhaka_tesla_pool}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dhaka_tesla_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dhaka_tesla_network

volumes:
  dhaka_tesla_pgdata:

networks:
  dhaka_tesla_network:
    driver: bridge
